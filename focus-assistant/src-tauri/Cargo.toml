[package]
name = "focus-assistant"
version = "0.1.0"
description = "A local-first desktop focus assistant"
authors = ["Focus contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "focus_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
